name: Garmin schema drift
description: Report a Garmin response shape that fails validation.
title: 'schema: '
labels: ['bug', 'schema', 'garmin-drift']
body:
  - type: markdown
    attributes:
      value: |
        Do not paste raw private payloads. Prefer `GarminValidationError.issues`, endpoint path, and a minimized redacted shape.
  - type: input
    id: endpoint
    attributes:
      label: Endpoint or SDK method
      placeholder: garmin.health.getBodyBattery(date)
    validations:
      required: true
  - type: textarea
    id: issues
    attributes:
      label: Validation issues
      description: Paste `GarminValidationError.issues` and status only.
      render: text
    validations:
      required: true
  - type: textarea
    id: redacted_shape
    attributes:
      label: Redacted shape
      description: Optional minimized object shape with values removed or replaced by types.
      render: json
  - type: input
    id: version
    attributes:
      label: SDK version
      placeholder: 1.0.0
    validations:
      required: true
